<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book場啦你</title>
    
    <!-- PWA 專用設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Book場啦你">
    <meta name="theme-color" content="#007aff">

    <style>
        /* 極致壓縮 margin / padding，文字進一步放大 */
        body { font-family: sans-serif; font-size: 15px; margin: 0; padding: 2px; background: #fff; }
        
        .top-bar { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; overflow-x: auto; }
        .date-bar { display: flex; gap: 4px; }
        
        .date-btn { padding: 4px 8px; background: #007aff; color: white; border: none; border-radius: 3px; cursor: pointer; white-space: nowrap; font-size: 15px; font-weight: bold; }
        .date-btn.active { background: #ff3b30; }
        
        .refresh-btn { padding: 4px 8px; background: #34c759; color: white; border: none; border-radius: 3px; cursor: pointer; white-space: nowrap; font-weight: bold; font-size: 15px; }
        
        .batch-bar { margin-bottom: 4px; background: #f0f0f5; padding: 3px 6px; border: 1px solid #ccc; display: inline-block; border-radius: 3px; }
        .batch-bar button { font-size: 14px; padding: 2px 6px; cursor: pointer; font-weight: bold; }
        
        .table-container { overflow-x: auto; max-height: 80vh; }
        
        /* 表格與格仔設計：強行縮窄時段寬度，放大字體 */
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        th, td { border: 1px solid #ccc; padding: 2px 1px; text-align: center; overflow: hidden; }
        
        /* 表頭時段 (7-22) 欄位縮窄，字體放大 */
        th { background: #e5e5ea; position: sticky; top: 0; z-index: 2; font-size: 14px; width: 22px; }
        
        /* 場館名稱欄位維持適當寬度以容納文字 */
        .venue-col { text-align: left; padding-left: 4px; position: sticky; left: 0; background: #f9f9f9; z-index: 1; white-space: nowrap; font-size: 15px; width: 110px; }
        
        /* 可訂場數：數字加粗加大 (17px) */
        .has-court { background: #34c759; color: white; font-weight: bold; font-size: 17px; }
        
        /* 一般吉場或空格文字 */
        .court-cell { font-size: 14px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="refresh-btn" onclick="refreshData()">🔄 更新</button>
        <div class="date-bar" id="dateBar"></div>
    </div>

    <div class="batch-bar">
        場館篩選：
        <button onclick="toggleAll(true)">全選</button>
        <button onclick="toggleAll(false)">全不選</button>
    </div>

    <div class="table-container">
        <table id="matrixTable"></table>
    </div>

    <script>
        let rawData = [], currentDate = '', sortedNames = [], venueMap = new Map();

        async function init() {
            try {
                const res = await fetch('data.json');
                rawData = await res.json();
                
                rawData.forEach(item => {
                    if(item.Venue_Name_TC) {
                        const name = item.Venue_Name_TC.trim();
                        if(!venueMap.has(name)) venueMap.set(name, item.District_Name_TC);
                    }
                });

                sortedNames = Array.from(venueMap.keys()).sort((a, b) => {
                    const distA = venueMap.get(a), distB = venueMap.get(b);
                    if (distA === '沙田區' && distB !== '沙田區') return -1;
                    if (distB === '沙田區' && distA !== '沙田區') return 1;
                    if (distA === '離島區' && distB !== '離島區') return 1;
                    if (distB === '離島區' && distA !== '離島區') return -1;
                    return distA.localeCompare(distB) || a.localeCompare(b);
                });

                const dates = Array.from(new Set(rawData.map(i => i.Available_Date))).sort();
                if (dates.length > 0) currentDate = dates[0];
                
                const dateBar = document.getElementById('dateBar');
                dateBar.innerHTML = '';
                dates.forEach(d => {
                    dateBar.innerHTML += `<button class="date-btn ${d===currentDate?'active':''}" onclick="changeDate('${d}')">${d.slice(5)}</button>`;
                });
                
                buildTableStructure();
            } catch (err) {
                alert("載入數據失敗：" + err.message);
            }
        }

        function buildTableStructure() {
            const table = document.getElementById('matrixTable');
            let html = `<thead><tr><th class="venue-col" style="z-index: 3; background: #e5e5ea;">場館</th>`;
            for (let i = 7; i <= 22; i++) {
                html += `<th>${i}</th>`;
            }
            html += `</tr></thead><tbody id="tableBody">`;
            
            sortedNames.forEach(name => {
                html += `<tr data-venue="${name}">
                    <td class="venue-col">
                        <label style="cursor:pointer; display:block; overflow:hidden; text-overflow:ellipsis;">
                            <input type="checkbox" name="vCb" value="${name}" checked onchange="filterRows()"> 
                            ${name}
                        </label>
                    </td>`;
                
                for(let i=7; i<=22; i++) {
                    html += `<td class="court-cell" data-hour="${i.toString().padStart(2, '0')}:00"></td>`;
                }
                html += `</tr>`;
            });
            
            table.innerHTML = html + `</tbody>`;
            updateTableData();
        }

        function updateTableData() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const name = row.getAttribute('data-venue');
                const cells = row.querySelectorAll('.court-cell');
                cells.forEach(cell => {
                    const t = cell.getAttribute('data-hour');
                    const rec = rawData.find(r => r.Available_Date === currentDate && r.Venue_Name_TC.trim() === name && r.Session_Start_Time === t);
                    const count = rec ? parseInt(rec.Available_Courts) : 0;
                    
                    cell.innerText = count > 0 ? count : '';
                    cell.className = count > 0 ? 'court-cell has-court' : 'court-cell';
                });
            });
        }

        function changeDate(d) {
            currentDate = d;
            document.querySelectorAll('.date-btn').forEach(btn => {
                btn.className = btn.innerText === d.slice(5) ? 'date-btn active' : 'date-btn';
            });
            updateTableData();
        }

        function filterRows() {
            const checkboxes = document.querySelectorAll('input[name="vCb"]');
            checkboxes.forEach(cb => {
                const row = cb.closest('tr');
                row.style.display = cb.checked ? '' : 'none';
            });
        }

        function toggleAll(status) {
            document.querySelectorAll('input[name="vCb"]').forEach(cb => cb.checked = status);
            filterRows();
        }

        function refreshData() {
            location.reload(true);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }

        init();
    </script>
</body>
</html>
