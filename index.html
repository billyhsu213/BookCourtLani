<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book場啦你</title>
    
    <!-- PWA 專用設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Book場啦你">
    <meta name="theme-color" content="#007aff">

    <style>
        /* 極致壓縮邊距與行高，確保一版睇晒 */
        body { font-family: sans-serif; font-size: 13px; margin: 0; padding: 1px; background: #fff; }
        
        .top-bar { display: flex; gap: 3px; margin-bottom: 2px; align-items: center; }
        .date-bar { display: flex; gap: 3px; overflow-x: auto; }
        
        .date-btn { padding: 3px 6px; background: #007aff; color: white; border: none; border-radius: 3px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: bold; }
        .date-btn.active { background: #ff3b30; }
        
        .refresh-btn { padding: 3px 6px; background: #34c759; color: white; border: none; border-radius: 3px; cursor: pointer; white-space: nowrap; font-weight: bold; font-size: 13px; }
        
        .batch-bar { margin-bottom: 2px; background: #f0f0f5; padding: 2px 4px; border: 1px solid #ccc; display: inline-block; border-radius: 3px; }
        .batch-bar button { font-size: 12px; padding: 1px 4px; cursor: pointer; font-weight: bold; }
        
        /* 移除外層 container 的 overflow-x 強制逼入一頁 */
        .table-container { width: 100%; overflow: hidden; }
        
        /* 強制表格平分空間，縮小每小時欄寬 */
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        th, td { border: 1px solid #ccc; padding: 1px 0px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* 時段欄位 (7-22 共16欄) 自動均分剩餘空間，極度縮窄 */
        th { background: #e5e5ea; position: sticky; top: 0; z-index: 2; font-size: 11px; }
        
        /* 場館名稱欄位佔適當比例 */
        .venue-col { text-align: left; padding-left: 2px; position: sticky; left: 0; background: #f9f9f9; z-index: 1; font-size: 12px; width: 28%; }
        .venue-col label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        
        /* 可訂場數：數字加粗加大 */
        .has-court { background: #34c759; color: white; font-weight: bold; font-size: 14px; }
        
        .court-cell { font-size: 12px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="refresh-btn" onclick="refreshData()">🔄 更新</button>
        <div class="date-bar" id="dateBar"></div>
    </div>

    <div class="batch-bar">
        場館篩選：
        <button onclick="toggleAll(true)">全選</button>
        <button onclick="toggleAll(false)">全不選</button>
    </div>

    <div class="table-container">
        <table id="matrixTable"></table>
    </div>

    <script>

            "瑞和街體育館": "瑞和街",
            "曉光街體育館": "曉光街",
            "藍田南體育館": "藍田南",
            "鯉魚門體育館": "鯉魚門",
            "坪洲體育館": "坪洲",
            "東涌文東路體育館": "東涌文東路",
            "長洲體育館 (毗鄰排務路)": "長洲",
            "海傍街體育館 (長洲市政大廈內)": "海傍街",
            "梅窩體育館": "梅窩"
        };

        async function init() {
            try {
                // 加入時間戳，阻止瀏覽器 cache
                const res = await fetch('data.json?t=' + new Date().getTime());
                rawData = await res.json();
                
                rawData.forEach(item => {
                    if(item.Venue_Name_TC) {
                        const name = item.Venue_Name_TC.trim();
                        if(!venueMap.has(name)) venueMap.set(name, item.District_Name_TC);
                    }
                });

                sortedNames = Array.from(venueMap.keys()).sort((a, b) => {
                    const distA = venueMap.get(a), distB = venueMap.get(b);
                    if (distA === '沙田區' && distB !== '沙田區') return -1;
                    if (distB === '沙田區' && distA !== '沙田區') return 1;
                    if (distA === '離島區' && distB !== '離島區') return 1;
                    if (distB === '離島區' && distA !== '離島區') return -1;
                    return distA.localeCompare(distB) || a.localeCompare(b);
                });

                const dates = Array.from(new Set(rawData.map(i => i.Available_Date))).sort();
                if (dates.length > 0) currentDate = dates[0];
                
                const dateBar = document.getElementById('dateBar');
                dateBar.innerHTML = '';
                dates.forEach(d => {
                    dateBar.innerHTML += `<button class="date-btn ${d===currentDate?'active':''}" onclick="changeDate('${d}')">${d.slice(5)}</button>`;
                });
                
                buildTableStructure();
            } catch (err) {
                alert("載入數據失敗：" + err.message);
            }
        }

        function buildTableStructure() {
            const table = document.getElementById('matrixTable');
            let html = `<thead><tr><th class="venue-col" style="z-index: 3; background: #e5e5ea;">場館</th>`;
            for (let i = 7; i <= 22; i++) {
                html += `<th>${i}</th>`;
            }
            html += `</tr></thead><tbody id="tableBody">`;
            
            sortedNames.forEach(name => {
             const displayName = nameMap[name] || name; // 自動轉換成你嘅短名（如果對唔到就照用原名）
                html += `<tr data-venue="${name}">
                    <td class="venue-col">
                        <label>
                            <input type="checkbox" name="vCb" value="${name}" checked onchange="filterRows()"> 
                            ${displayName}
                        </label>
                    </td>`;
                
                for(let i=7; i<=22; i++) {
                    html += `<td class="court-cell" data-hour="${i.toString().padStart(2, '0')}:00"></td>`;
                }
                html += `</tr>`;
            });
            
            table.innerHTML = html + `</tbody>`;
            updateTableData();
        }

        function updateTableData() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const name = row.getAttribute('data-venue');
                const cells = row.querySelectorAll('.court-cell');
                cells.forEach(cell => {
                    const t = cell.getAttribute('data-hour');
                    
                    // 嚴格匹配日期、場館名稱及時段
                    const rec = rawData.find(r => 
                        r.Available_Date === currentDate && 
                        r.Venue_Name_TC.trim() === name && 
                        r.Session_Start_Time === t
                    );
                    
                    // 確保安全轉換數字，非數字或小於等於0一律視為0
                    const count = rec ? parseInt(rec.Available_Courts) || 0 : 0;
                    
                    // 只有大於0至會顯示數字同綠色，否則完全空白
                    cell.innerText = count > 0 ? count : '';
                    cell.className = count > 0 ? 'court-cell has-court' : 'court-cell';
                });
            });
        }

        function changeDate(d) {
            currentDate = d;
            document.querySelectorAll('.date-btn').forEach(btn => {
                btn.className = btn.innerText === d.slice(5) ? 'date-btn active' : 'date-btn';
            });
            updateTableData();
        }

        function filterRows() {
            const checkboxes = document.querySelectorAll('input[name="vCb"]');
            checkboxes.forEach(cb => {
                const row = cb.closest('tr');
                row.style.display = cb.checked ? '' : 'none';
            });
        }

        function toggleAll(status) {
            document.querySelectorAll('input[name="vCb"]').forEach(cb => cb.checked = status);
            filterRows();
        }

        function refreshData() {
            location.reload(true);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }

        init();
    </script>
</body>
</html>
